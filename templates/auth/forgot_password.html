{% extends "base.html" %}

{% block title %}Forgot Password - AI AdMonitor{% endblock %}
{% block page_title %}Reset Password{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="saas-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.4rem; font-weight: 800;">Reset Your Password</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.3rem;">Enter your email address to receive password recovery instructions</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase;">Email Address</label>
        <input type="email" name="email" placeholder="owner@abcelectronics.com" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff;">
      </div>

      <button type="submit" class="btn-saas btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
        <i class="fa-solid fa-paper-plane"></i> Send Password Reset Link
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem; font-size: 0.88rem;">
      <a href="{{ url_for('auth.login') }}" style="color: var(--accent-cyan); text-decoration: none;">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
