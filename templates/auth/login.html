{% extends "base.html" %}

{% block title %}Login - AI AdMonitor{% endblock %}
{% block page_title %}Account Login{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="saas-card" style="box-shadow: 0 12px 40px rgba(0,0,0,0.5);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-brain"></i>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem;">Sign in to monitor your Google Ads AI insights</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase;">Email Address</label>
        <input type="email" name="email" value="owner@abcelectronics.com" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.8rem; color: var(--accent-cyan); text-decoration: none;">Forgot password?</a>
        </div>
        <input type="password" name="password" value="demo1234" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
        <input type="checkbox" name="remember" id="remember" checked style="accent-color: var(--primary);">
        <label for="remember" style="font-size: 0.88rem; color: var(--text-muted);">Remember this browser</label>
      </div>

      <button type="submit" class="btn-saas btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Log In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem; font-size: 0.88rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Register Company</a>
    </div>
  </div>
</div>
{% endblock %}
